<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aspirant – APPSC Group 1 & 2 Current Affairs | Daily Updates</title>
<meta name="description" content="Aspirant: daily current affairs for APPSC Group 1 and Group 2: Andhra Pradesh, national, economy and more, with background, related events and practice questions.">
<meta name="theme-color" content="#0f6e56">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#66655f;--ac:#0f6e56;--ac2:#e1f5ee;--bd:#e0ded6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--card:#222221;--tx:#ecebe5;--mu:#a3a29a;--ac:#5dcaa5;--ac2:#10342b;--bd:#383835;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:8px 0 2px}
.sub,.st{color:var(--mu);font-size:.85rem}.st{display:flex;justify-content:space-between;gap:8px;margin:6px 0 10px;align-items:center}
input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
button{font:inherit;color:inherit}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--bd);background:var(--card);padding:6px 12px;border-radius:99px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0;cursor:pointer}
.card:hover,.card:focus{border-color:var(--ac);outline:none}.card h3{margin:4px 0;font-size:1.05rem}
.meta{font-size:.78rem;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{background:var(--ac2);color:var(--ac);padding:1px 8px;border-radius:99px;font-weight:600}
.new{background:#e24b4a;color:#fff;padding:1px 8px;border-radius:99px;font-size:.7rem;font-weight:700}
.lk{background:none;border:none;color:var(--ac);cursor:pointer;padding:6px 0;font-size:.95rem}
.sm{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.85rem}
h2{font-size:.95rem;color:var(--ac);margin:20px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 16px 14px}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}.q{border-left:3px solid var(--ac);padding:2px 12px;margin:10px 0}
details summary{cursor:pointer;color:var(--ac);font-size:.9rem}a{color:var(--ac)}
.warn{background:var(--ac2);border-radius:10px;padding:10px 14px;font-size:.85rem;margin:12px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:99px;font-size:.9rem;display:none}
.note{font-size:.78rem;color:var(--mu);margin:28px 0 8px;border-top:1px solid var(--bd);padding-top:12px}
</style></head><body><div class="w"><div id="app"><p>Loading…</p></div>
<noscript>Please enable JavaScript to read current affairs.</noscript>
<p class="note">Headlines link to their original publishers. Exam notes marked “AI-generated” can contain errors: verify with The Hindu, Eenadu, PIB, official AP Government sources and the APPSC syllabus. Aspirant is an independent project and is not affiliated with APPSC.</p></div>
<div id="toast"></div>
<script>
const REFRESH_MS=60000,PAGE=30,CK="appsc:cache",BK="appsc:saved";
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const li=a=>"<ul>"+(Array.isArray(a)?a:[]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
const fmt=d=>{const t=new Date(d);return isNaN(t)?esc(d):t.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return isNaN(m)?"":m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const isNew=d=>Date.now()-new Date(d)<3*864e5;
let ITEMS=[],UPDATED=null,cat="All",qs="",shown=PAGE,view="",online=true,saved=new Set(JSON.parse(ls.get(BK)||"[]"));
const app=$("app");
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)}
async function load(){
  const first=!ITEMS.length;
  try{
    const r=await fetch("data/affairs.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();if(!d||!Array.isArray(d.items))throw new Error("bad");
    const had=new Set(ITEMS.map(i=>i.id)),n=d.items.filter(i=>!had.has(i.id)).length;
    ITEMS=d.items;UPDATED=d.updated;online=true;ls.set(CK,JSON.stringify({updated:d.updated,items:d.items.slice(0,300)}));
    if(!first&&n)toast(n+" new "+(n>1?"items":"item"));
  }catch(e){
    online=false;
    if(first){try{const c=JSON.parse(ls.get(CK)||"null");if(c){ITEMS=c.items;UPDATED=c.updated}}catch(x){}}
  }
  route(true);
}
function status(){const s=$("st");if(s)s.firstChild.textContent=(online?"Updated ":"Offline – showing saved copy from ")+ago(UPDATED)+" · auto-refreshes every minute"}
function list(){
  app.innerHTML='<h1>Aspirant</h1><div class="sub">APPSC Group 1 &amp; Group 2 current affairs · Andhra Pradesh &amp; India</div><div class="st" id="st"><span></span><button class="sm" id="rf">Refresh</button></div><input id="s" type="search" aria-label="Search" placeholder="Search topics…"><div class="chips" id="ch"></div><div id="cd"></div>';
  $("s").value=qs;$("s").oninput=e=>{qs=e.target.value.toLowerCase();shown=PAGE;fill()};
  $("rf").onclick=()=>load();fill();
}
function fill(){
  status();
  const cats=["All","Saved",...[...new Set(ITEMS.map(i=>i.cat))].sort()];
  $("ch").innerHTML=cats.map(c=>'<button class="chip'+(c==cat?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  $("ch").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;shown=PAGE;fill()});
  const f=ITEMS.filter(i=>(cat=="All"||(cat=="Saved"?saved.has(i.id):i.cat==cat))&&(!qs||(i.title+" "+i.sum).toLowerCase().includes(qs)));
  $("cd").innerHTML=f.slice(0,shown).map(i=>'<div class="card" tabindex="0" data-id="'+esc(i.id)+'"><div class="meta"><span class="tag">'+esc(i.cat)+'</span><span>'+fmt(i.date)+'</span>'+(isNew(i.date)?'<span class="new">NEW</span>':"")+'</div><h3>'+esc(i.title)+'</h3><div class="meta">'+esc((i.sum||"").slice(0,150))+'</div></div>').join("")||"<p>No topics found.</p>";
  if(f.length>shown)$("cd").insertAdjacentHTML("beforeend",'<button class="sm" id="mr">Show more ('+(f.length-shown)+')</button>');
  const mr=$("mr");if(mr)mr.onclick=()=>{shown+=PAGE;fill()};
  $("cd").querySelectorAll(".card").forEach(c=>{c.onclick=()=>{location.hash=c.dataset.id};c.onkeydown=e=>{if(e.key=="Enter")location.hash=c.dataset.id}});
}
function detail(i){
  const sv=saved.has(i.id),link=/^https:\/\//.test(i.link||"")?i.link:"";
  app.innerHTML='<button class="lk" id="b">← All current affairs</button><div class="meta"><span class="tag">'+esc(i.cat)+'</span><span>'+fmt(i.date)+'</span><span>'+esc(i.src||"")+'</span></div><h1>'+esc(i.title)+'</h1><p><button class="sm" id="sv">'+(sv?"★ Saved":"☆ Save")+'</button> <button class="sm" id="sh">Share</button></p>'+
  '<h2>What happened</h2><div class="box"><p>'+esc(i.sum)+'</p>'+(link?'<p><a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">Read original report ↗</a></p>':"")+'</div>'+
  (i.enriched?(i.ai?'<div class="warn">These exam notes are AI-generated. Verify facts before relying on them.</div>':"")+'<h2>Background &amp; key facts</h2><div class="box">'+li(i.bg)+'</div><h2>How it connects · earlier events</h2><div class="box">'+li(i.rel)+'</div><h2>Exam angle</h2><div class="box">'+li(i.ex)+'</div><h2>Practice questions</h2><div class="box">'+(i.mcq||[]).map(m=>'<div class="q"><b>'+esc(m[0])+'</b><details><summary>Show answer</summary>'+esc(m[1])+'</details></div>').join("")+'</div>':'<div class="warn">Detailed notes for this item are still being prepared. Check back shortly.</div>');
  $("b").onclick=()=>{location.hash=""};
  $("sv").onclick=()=>{saved.has(i.id)?saved.delete(i.id):saved.add(i.id);ls.set(BK,JSON.stringify([...saved]));detail(i)};
  $("sh").onclick=async()=>{try{if(navigator.share)await navigator.share({title:i.title,url:location.href});else{await navigator.clipboard.writeText(location.href);toast("Link copied")}}catch(e){}};
  document.title=i.title+" | Aspirant";scrollTo(0,0);
}
function route(refresh){
  const id=location.hash.slice(1),i=ITEMS.find(x=>x.id==id);
  if(i){if(view!=id||!refresh){view=id;detail(i)}return}
  document.title="Aspirant – APPSC Group 1 & 2 Current Affairs | Daily Updates";
  if(view!==""||!$("cd")){view="";list()}else fill();
}
addEventListener("hashchange",()=>route(false));
setInterval(()=>{if(!document.hidden)load()},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
addEventListener("online",()=>load());
load();
</script></body></html>
